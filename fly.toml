# Fly.io deployment config for Cloze. See the README "Deploy your own on Fly.io".
# `fly launch` will set `app` to a unique name and pick a region for you.
app = "cloze"
primary_region = "iad"

# Empty [build] means Fly builds from the Dockerfile in this repo.
[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle to keep the bill to a few dollars a month.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # Apply pending Prisma migrations before each release goes live.
  release_command = "npx prisma migrate deploy"
